# I am the daily half of a two workflow pipeline. This workflow
# regenerates the newspaper and commits it. The deploy workflow
# (.github/workflows/static.yml) runs after this one succeeds, applies
# the Matrix theme with update_feed.sh, and publishes dist/ to Pages.
# The theme is applied there, not here, so the dist/ this workflow
# commits is the plain generator output.
name: Update Hackers Den
on:
  schedule:
    - cron: "0 3 * * *"  # Run daily at 3 AM for less server load
  push:
    branches:
      - main
  workflow_dispatch:    # Allow manual triggering

permissions:
  contents: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # I fetch a shallow checkout, depth 1. A comment
          # on this line used to claim it fetched all history. It does not,
          # and nothing in this workflow reads history, so shallow is fine.
          submodules: false  # Do not attempt to checkout submodules
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      
      # Deleting dist/ first means anything in dist/ that the steps below
      # do not recreate is gone from the commit at the end. The JAR
      # recreates the newspaper, and a later step recreates the service
      # worker, the manifest copy, and .nojekyll. The Matrix CSS and JS
      # are not recreated here at all. They return only when the deploy
      # workflow runs update_feed.sh, and that workflow does not commit,
      # so the committed dist/ never carries them.
      - name: Clean previous builds
        run: |
          rm -rf ./dist
          echo "🧹 Cleaned previous build artifacts"
      
      # The heredocs in this step are the copies that win. This step
      # rewrites config.yaml, README.md, and manifest.json from the text
      # below on every run, so an edit I make to those files directly is
      # overwritten the next time this workflow runs. When I change one
      # of them, I change the copy here too, in the same commit. That is
      # why the config and the service worker further down carry the
      # same comments as the files they write: Comment Wave 7 put them
      # in both places so the comments survive the rewrite.
      - name: Update Hackers-Den branding
        run: |
          echo "🔄 Updating Hackers-Den branding throughout the project..."
          
          # Update config.yaml to use our dark theme and Hackers-Den branding
          cat > ./config.yaml << 'EOL'
          # Hackers-Den - Matrix-themed RSS feed
          title: "Hackers-Den"

          # I name the built-in dark theme here because the JAR only takes its
          # own themes. My Matrix styling is not a JAR theme at all: update_feed.sh
          # applies it to the generated HTML after the JAR has run, which is why
          # this file says dark while the finished site wears the Matrix CSS.
          theme: dark

          # This says daily, and the update workflow also runs daily at 03:00
          # UTC. The two settings sit in different files and neither reads the
          # other, so changing one without the other leaves them out of step.
          edition: daily

          # Cybersecurity and hacking-focused feeds
          # The first three feeds are not sites with their own RSS. They are
          # newsletters I routed through kill-the-newsletter, which turns an
          # email subscription into a feed URL. site_methods.txt holds the notes
          # I made when I picked these sources, including one source I dropped.
          # Nothing in this repo prunes this list, so a feed that dies stays
          # listed here until I remove it by hand. The list is the record.
          feeds:
            # Current feeds
            - https://kill-the-newsletter.com/feeds/oozrzxtg7nxieettty99.xml
            - https://kill-the-newsletter.com/feeds/nzaowh59yejdvcx52y6d.xml
            - https://kill-the-newsletter.com/feeds/yz1olmn3cz6i3w7v30at.xml
            - https://isc.sans.edu/dailypodcast.xml
            - https://feeds.megaphone.fm/hacking-humans
            - https://podcast.darknetdiaries.com
            
            # Additional top security feeds
            - https://krebsonsecurity.com/feed/
            - https://feeds.feedburner.com/TheHackersNews
            - https://www.schneier.com/blog/atom.xml
            - https://threatpost.com/feed/
            - https://www.zdnet.com/topic/security/rss.xml
            - https://nakedsecurity.sophos.com/feed
            - https://www.securityweek.com/feed/
            - https://www.darkreading.com/rss.xml
            - https://www.bleepingcomputer.com/feed/
            - https://www.helpnetsecurity.com/feed/
          EOL
          
          # Update README.md with Hackers-Den branding
          cat > ./README.md << 'EOL'
          # Hackers-Den

          A Matrix-themed cybersecurity RSS newspaper, regenerated daily with GitHub Actions and published with GitHub Pages.

          ## About

          Hackers-Den is a customized implementation of the RSSpaper project. The RSSpaper JAR reads the feeds listed in `config.yaml` (16 feeds, including Krebs on Security, The Hacker News, Schneier on Security, BleepingComputer, Dark Reading, and the SANS Internet Storm Center podcast) and generates a static newspaper in `dist/`. A post-processing script then applies the Matrix theme on top of the generated site:

          - Matrix-inspired green-on-black styling with a "digital rain" background effect
          - Terminal-style article headers and staggered article animations
          - A service worker and web app manifest, so the generated site can be installed as a PWA and cache its shell assets for offline reading

          See `matrix-theme-readme.md` for how the theme layer works.

          ## How it updates

          Two GitHub Actions workflows keep the site current:

          1. **Update Hackers Den** (`.github/workflows/update.yml`) runs daily at 03:00 UTC, on pushes to `main`, and on manual dispatch. It runs the RSSpaper JAR with Java 17, refreshes the generated `dist/` output, and commits the result.
          2. **Deploy Hackers-Den to GitHub Pages** (`.github/workflows/static.yml`) runs after the update workflow succeeds. It runs `update_feed.sh`, which applies the Matrix theme to the generated site, and deploys `dist/` to GitHub Pages.

          ## Running it locally

          Requirements: Java 17 and `perl` (used by the theme script for two scoped HTML edits), plus network access to fetch the configured feeds.

          ```bash
          java -jar rsspaper-1.2.4-standalone.jar   # generates dist/ from config.yaml
          ./update_feed.sh                            # applies the Matrix theme to dist/
          ```

          Open `dist/index.html` in a browser to read the result. Note that `update_feed.sh` also runs the JAR itself as its first step, so running it alone performs the full build.

          ## Repository layout

          - `config.yaml` - site title, theme, edition, and the feed list
          - `rsspaper-1.2.4-standalone.jar` - the RSSpaper generator (upstream, see Credits)
          - `update_feed.sh` - runs the generator, then applies the Matrix theme
          - `matrix-theme-backup/` - the canonical copies of the theme CSS and JavaScript that `update_feed.sh` copies into `dist/`
          - `themes/` - earlier theme variants kept for reference
          - `dist/` - the generated site committed by the update workflow (do not edit by hand; it is regenerated)
          - `site_methods.txt` - notes on the newsletters and sources the feed list was built from

          ## Credits

          Based on:

          - [RSSPAPER](https://github.com/tanrax/RSSPAPER) - the core RSS feed generator
          - [GitHub Pages](https://pages.github.com/) - hosting for the static site

          ## License

          This project is licensed under the terms included in the LICENSE file.

          ## Author

          Created and maintained by CY83R-3X71NC710N
          EOL
          
          # Update manifest.json for Hackers-Den PWA
          cat > ./manifest.json << 'EOL'
          {
            "name": "Hackers-Den",
            "short_name": "Hackers-Den",
            "description": "Matrix-themed cybersecurity and hacking news aggregator",
            "start_url": "/",
            "display": "standalone",
            "background_color": "#000000",
            "theme_color": "#00FF00",
            "icons": [
              {
                "src": "static/img/icons/apple-icon-180.png",
                "sizes": "180x180",
                "type": "image/png",
                "purpose": "any"
              },
              {
                "src": "static/img/icons/manifest-icon-192.png",
                "sizes": "192x192",
                "type": "image/png",
                "purpose": "any maskable"
              },
              {
                "src": "static/img/icons/manifest-icon-512.png",
                "sizes": "512x512",
                "type": "image/png",
                "purpose": "any maskable"
              }
            ]
          }
          EOL
          
          echo "✅ Hackers-Den branding updated successfully"
      
      - name: Generate Hackers-Den RSS newspaper
        run: |
          echo "🔄 Generating Hackers-Den RSS feed using existing JAR..."
          
          # Use the existing JAR file in the repository
          java -jar ./rsspaper-1.2.4-standalone.jar
          
          echo "✅ RSS feed generated successfully"
      
      - name: Apply additional Hackers-Den branding
        run: |
          echo "🔄 Applying additional Hackers-Den branding..."
          
          # Create service worker for PWA support
          cat > ./dist/service-worker.js << 'EOL'
          // I keep this worker at the root of dist/ on purpose. A service
          // worker can only control pages at or below the folder it is served
          // from, and an earlier copy of this file sat under dist/static/,
          // which limited it to that subtree and left the newspaper itself
          // outside its scope. The registration in the themed page points at
          // service-worker.js relative to the page, so this file's location
          // and that registration have to stay in step.
          // Hackers-Den Service Worker
          // The name below has stayed at v1 since I wrote it. Nothing in this
          // file deletes old caches: there is no activate handler at all, and
          // caches.match in the fetch handler searches every cache on the
          // origin, so entries stored under an older name would still be
          // served. If I ever change the list below, I have to change this
          // name too and accept that the old cache stays on readers' machines.
          const CACHE_NAME = 'hackers-den-cache-v1';
          // I wrote these paths from the domain root. That lines up only if
          // the site is served from the root of its domain. Served from a
          // subpath, the way a GitHub Pages project site is, each of these
          // points outside the site, and the install below fails on them.
          // The list also has to name files that exist. cache.addAll is all
          // or nothing: one bad entry rejects the whole install and the
          // worker never activates. That is how the earlier version of this
          // list broke, when it named a font file that was never in the repo.
          const urlsToCache = [
            '/',
            '/index.html',
            '/static/css/main.css',
            '/static/css/desktop.css',
            '/static/css/mobile.css',
            '/static/css/normalize.css',
            '/static/fonts/Newsreader-VariableFont_opsz,wght.woff2',
            '/static/img/newsreader-not-cover.png'
          ];

          self.addEventListener('install', event => {
            event.waitUntil(
              caches.open(CACHE_NAME)
                .then(cache => {
                  console.log('Opened cache');
                  return cache.addAll(urlsToCache);
                })
            );
          });

          // The fetch handler serves the cache first and the network second.
          // A page this worker has cached is served from the cache on every
          // later visit, and the network copy is never compared, so a reader
          // can keep seeing a cached newspaper until the cache name changes.
          // Responses fetched from the network are stored below, which is how
          // pages beyond the install list get cached at all.
          self.addEventListener('fetch', event => {
            event.respondWith(
              caches.match(event.request)
                .then(response => {
                  if (response) {
                    return response;
                  }
                  return fetch(event.request).then(
                    response => {
                      if(!response || response.status !== 200 || response.type !== 'basic') {
                        return response;
                      }
                      // The clone matters: a response body can be read once,
                      // and the original is returned to the page below. Without
                      // the clone, storing it and returning it would fight over
                      // the same body. The put itself is not returned or
                      // awaited, so the fetch finishes without waiting for the
                      // cache write, and nothing here reports it if it fails.
                      const responseToCache = response.clone();
                      caches.open(CACHE_NAME)
                        .then(cache => {
                          cache.put(event.request, responseToCache);
                        });
                      return response;
                    }
                  );
                })
            );
          });
          EOL
          
          # Update meta description and title for better SEO and consistent branding
          sed -i 's|<meta name="description" content="My static news generator">|<meta name="description" content="Hackers-Den - Matrix-themed cybersecurity and hacking news aggregator">|' ./dist/index.html
          sed -i 's|<meta name="generator" content="RSSPAPER">|<meta name="generator" content="Hackers-Den">|' ./dist/index.html
          
          # Update the page title in case it's not correctly set
          sed -i 's|<title>.*</title>|<title>Hackers-Den</title>|' ./dist/index.html
          
          # Update the subtitle text to be more Hackers-Den branded
          sed -i 's|<span class="subtitle__text">Latest Hacking News</span>|<span class="subtitle__text">Cybersecurity Intelligence</span>|' ./dist/index.html || echo "Could not update subtitle text"
          
          # Add Hackers-Den manifest to the dist directory
          cp ./manifest.json ./dist/
          
          # Create .nojekyll file to prevent GitHub Pages from using Jekyll processing
          touch ./dist/.nojekyll
          echo "✅ Created .nojekyll file to prevent GitHub Pages from processing with Jekyll"
          
          echo "✅ Additional Hackers-Den branding applied successfully"
      
      # The push at the end uses the workflow's own token. Pushes made
      # with that token do not start new workflow runs, which is what
      # stops this push triggered workflow from retriggering itself with
      # its own daily commit. The commit line ends with an or echo, so a
      # commit that fails for a reason other than no changes also prints
      # No changes to commit and the step still passes.
      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # Stage changes
          git add dist/** 
          git add README.md config.yaml manifest.json
          
          # Commit with conditional message
          git commit -m "🔒 Hackers-Den: Daily update $(date +%Y-%m-%d)" || echo "No changes to commit"
          
          # Push changes
          git push
