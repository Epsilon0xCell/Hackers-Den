# Hackers-Den - Matrix-themed RSS feed
title: "Hackers-Den"

# I name the built-in dark theme here because the JAR only takes its
# own themes. My Matrix styling is not a JAR theme at all: update_feed.sh
# applies it to the generated HTML after the JAR has run, which is why
# this file says dark while the finished site wears the Matrix CSS.
theme: dark

# This says daily, and the update workflow also runs daily at 03:00
# UTC. The two settings sit in different files and neither reads the
# other, so changing one without the other leaves them out of step.
edition: daily

# Cybersecurity and hacking-focused feeds
# The first three feeds in the last group are not sites with their own
# RSS. They are newsletters I routed through kill-the-newsletter, which
# turns an email subscription into a feed URL. site_methods.txt holds
# the notes I made when I picked these sources, including the sources
# I have dropped and why.
# I verified every URL below live on 2026-11-07: HTTP 200 after
# redirects, a body that parses as RSS or Atom, and a newest item no
# older than a few days. scripts/check_feeds.py repeats that check on
# demand and fails if any feed is dead or has gone 90 days without an
# item, which is the line I prune at. The three feeds I removed in
# this pass (Threatpost, Naked Security, ZDNet security) and the two
# candidates I rejected (Rapid7, the direct Mandiant feed) are
# recorded with their reasons in site_methods.txt.
feeds:
  # Official advisories and storm centers
  - https://www.cisa.gov/cybersecurity-advisories/all.xml
  - https://isc.sans.edu/rssfeed.xml

  # News wires
  - https://feeds.feedburner.com/TheHackersNews
